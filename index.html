<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verificador de precios</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:row;
  height:100vh;
}

.panel{
  width:40%;
  padding:20px;
}

.resultado{
  width:60%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  font-size:32px;
}

button{
  font-size:28px;
  padding:18px;
  margin-top:15px;
  width:100%;
  border-radius:12px;
  border:none;
  background:#22c55e;
  color:white;
  font-weight:bold;
}

input{
  font-size:26px;
  padding:10px;
  width:100%;
  border-radius:10px;
  border:none;
}

#producto{
  font-size:40px;
}

#precio{
  font-size:110px;
  color:#22c55e;
  font-weight:bold;
}

#reader{
  width:350px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="panel">

<h1>Verificador</h1>

<input type="file" id="fileInput">

<br><br>

<input type="text" id="buscarCodigo" placeholder="Código">

<button onclick="buscarManual()">Buscar</button>

<button onclick="iniciarScanner()">Escanear</button>

<div id="reader"></div>

</div>

<div class="resultado">
<h2 id="producto"></h2>
<div id="precio"></div>
</div>

<script>
let baseDatos = [];

document.getElementById('fileInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(event){
        const text = event.target.result;
        const rows = text.split("\n");
        baseDatos = [];

        rows.slice(1).forEach(r=>{
            const c = r.split(/[,;\t]/);
            baseDatos.push({
                codigo:c[0]?.trim(),
                nombre:c[1]?.trim(),
                precio:c[5]?.trim()
            });
        });

        localStorage.setItem("productos", JSON.stringify(baseDatos));
        alert("Base de datos cargada");
    };

    reader.readAsText(file);
});

window.onload = function(){
    const guardado = localStorage.getItem("productos");
    if(guardado){
        baseDatos = JSON.parse(guardado);
    }
}

function buscarManual(){
    const codigo = document.getElementById("buscarCodigo").value;
    buscarProducto(codigo);
}

function iniciarScanner(){
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 300 },
        codigo => {
            buscarProducto(codigo);
            html5QrCode.stop();
        }
    );
}

function buscarProducto(codigo){
    const producto = baseDatos.find(p => p.codigo == codigo);

    if(producto){
        document.getElementById("producto").innerText = producto.nombre;
        document.getElementById("precio").innerText = "$ " + producto.precio;
    }else{
        document.getElementById("producto").innerText = "No encontrado";
        document.getElementById("precio").innerText = "";
    }
}
</script>

</body>
</html>
